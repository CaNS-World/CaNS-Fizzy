name: run-compiler
#
# builds and tests the variants of CaNS-Fizzy with one compiler;
# the variants and their tests are the same as in the local harness (tests/testall.sh): the interface methods
# (ACDI, THINC/QQ, geometric volume of fluid) are inputs of one build, the default variant
#

on:
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string
      cpu_target:
        description: "Portable CPU target requested by CI, if any"
        type: string
        default: ""
      test_modes:
        description: "JSON array of build modes to test"
        type: string
        default: '["opt", "dbg"]'
      variants:
        description: "JSON array of the variants to build and test"
        type: string
        default: '["default", "unbalanced"]'
      tests_default:
        description: "JSON array of the tests of the default variant; a suffix -thinc, -plic or -thincsplit selects that interface method"
        type: string
        default: '["lid_driven_cavity", "differentially_heated_cavity", "deforming_circle", "rising_bubble", "start_stop", "restart_two_fluid", "implicit_diffusion", "poisson", "taylor_green_vortex_2d", "navier_slip", "deforming_circle-thinc", "rising_bubble-thinc", "restart_two_fluid-thinc", "implicit_diffusion-thinc", "marangoni_layer", "markers", "marangoni_markers"]'

jobs:
  default:
    if: ${{ contains(fromJSON(inputs.variants), 'default') }}
    uses: ./.github/workflows/run-one.yml
    with:
      compiler: ${{ inputs.compiler }}
      cpu_target: ${{ inputs.cpu_target }}
      test_modes: ${{ inputs.test_modes }}
      variant: "default"
      tests: ${{ inputs.tests_default }}

  unbalanced:
    if: ${{ contains(fromJSON(inputs.variants), 'unbalanced') }}
    uses: ./.github/workflows/run-one.yml
    with:
      compiler: ${{ inputs.compiler }}
      cpu_target: ${{ inputs.cpu_target }}
      test_modes: ${{ inputs.test_modes }}
      build_modes: '["opt", "dbg"]'
      variant: "unbalanced"
      variant_flags: "BALANCED_CAPILLARY_PRESSURE_SPLIT=0"
      tests: '["rising_bubble", "restart_two_fluid"]'

  hypre:
    if: ${{ contains(fromJSON(inputs.variants), 'hypre') }}
    uses: ./.github/workflows/run-one.yml
    with:
      compiler: ${{ inputs.compiler }}
      cpu_target: ${{ inputs.cpu_target }}
      test_modes: ${{ inputs.test_modes }}
      build_modes: '["opt", "dbg"]'
      variant: "hypre"
      variant_flags: "CONSTANT_COEFFS_POISSON=0 HYPRE_HOME=/usr"
      tests: '["rising_bubble", "restart_two_fluid", "implicit_diffusion"]'
