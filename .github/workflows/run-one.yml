name: run-one

on:
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string
      cpu_target:
        description: "Portable CPU target requested by CI, if any"
        type: string
        default: ""
      test_modes:
        description: "JSON array of build modes to test"
        type: string
        default: '["opt", "dbg"]'
      build_modes:
        description: "JSON array of build modes to compile"
        type: string
        default: '["opt", "dbg"]'
      tests_in_one_job:
        description: "Run the tests of each build one after the other in a single job"
        type: boolean
        default: false
      variant:
        description: "Name of the build variant"
        type: string
        default: "acdi"
      variant_flags:
        description: "Build flags of the variant"
        type: string
        default: ""
      tests:
        description: "JSON array of the tests to run"
        required: true
        type: string

env:
  MODE_FLAGS: '{"opt": "FFLAGS_OPT=1", "dbg": "FFLAGS_DEBUG_MAX=1 FFLAGS_OPT=0"}'
  NVHPC_VERSION: "26.11" # version of the NVIDIA compiler (see `install-NVIDIA.sh`; `latest` follows the newest release)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        mode: ${{ fromJSON(inputs.build_modes) }}
      fail-fast: false # ensures that jobs run in parallel
    env:
      SKIP_BUILD: ${{ matrix.mode.name == 'opt-omp' }} # skipped combinations
      NVHPC_CPU_TARGET: ${{ inputs.cpu_target }}
      GNU_CPU_TARGET: ${{ inputs.cpu_target }}
    name: build-${{ matrix.mode }}
    steps:
    - name: Checkout code
      if: ${{ env.SKIP_BUILD != 'true' }}
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Set up the environment and get packages
      if: ${{ env.SKIP_BUILD != 'true' }}
      uses: ./.github/actions/build
      with:
        name: ${{ inputs.compiler }}-${{ inputs.variant }}-${{ matrix.mode }}
        compiler: ${{ inputs.compiler }}
        compiler_flags: ${{ fromJSON(env.MODE_FLAGS)[matrix.mode] }} ${{ inputs.variant_flags }}
        no-rebuild: false
  test:
    if: ${{ !inputs.tests_in_one_job }}
    timeout-minutes: 60 # 30 in CaNS; the debug builds of the long two-fluid tests need more
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        mode: ${{ fromJSON(inputs.test_modes) }}
        test-name: ${{ fromJSON(inputs.tests) }}
        exclude: # tests that do nothing more in a debug build: one is skipped there, the other builds its own program
        - mode: dbg
          test-name: single_precision
        - mode: dbg
          test-name: plic_unit
      fail-fast: false # ensures that jobs run in parallel
    name: test-${{ matrix.mode }}-${{ matrix.test-name }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: false
    - name: Set up the environment and get packages
      uses: ./.github/actions/build
      with:
        name: ${{ inputs.compiler }}-${{ inputs.variant }}-${{ matrix.mode }}
        compiler: ${{ inputs.compiler }}
        no-rebuild: true
        get-dependencies: ${{ matrix.test-name == 'single_precision' }} # the only test that builds the code
    - name: Run the test
      uses: ./.github/actions/test
      with:
        name: ${{ inputs.compiler }}-${{ inputs.variant }}-${{ matrix.mode }}-${{ matrix.test-name }}
        compiler: ${{ inputs.compiler }}
        mode: ${{ matrix.mode }}
        test_name: ${{ matrix.test-name }}
  test-all:
    #
    # the same tests, one after the other in one job per build
    #
    if: ${{ inputs.tests_in_one_job }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        mode: ${{ fromJSON(inputs.test_modes) }}
      fail-fast: false # ensures that jobs run in parallel
    name: test-${{ matrix.mode }}-all
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: false
    - name: Set up the environment and get packages
      uses: ./.github/actions/build
      with:
        name: ${{ inputs.compiler }}-${{ inputs.variant }}-${{ matrix.mode }}
        compiler: ${{ inputs.compiler }}
        no-rebuild: true
    - name: Run the tests
      uses: ./.github/actions/test
      with:
        name: ${{ inputs.compiler }}-${{ inputs.variant }}-${{ matrix.mode }}-all
        compiler: ${{ inputs.compiler }}
        mode: ${{ matrix.mode }}
        test_name: ${{ join(fromJSON(inputs.tests), ' ') }}
