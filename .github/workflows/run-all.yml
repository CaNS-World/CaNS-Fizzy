name: run-all

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review

jobs:
  GNU:
    uses: ./.github/workflows/run-compiler.yml
    with:
      compiler: "GNU"
      cpu_target: "x86-64"
      variants: '["default", "balanced", "hypre"]'
      tests_default: '["lid_driven_cavity", "differentially_heated_cavity", "deforming_circle", "rising_bubble", "start_stop", "restart_two_fluid", "implicit_diffusion", "poisson", "taylor_green_vortex_2d", "deforming_circle-thinc", "rising_bubble-thinc", "restart_two_fluid-thinc", "implicit_diffusion-thinc", "plic_unit", "plic_advection", "plic_momentum", "viscosity_limiter", "rising_bubble-plic", "restart_two_fluid-plic", "rising_bubble-thincsplit", "restart_two_fluid-thincsplit"]'

  INTEL:
    uses: ./.github/workflows/run-compiler.yml
    with:
      compiler: "INTEL"
      test_modes: '["dbg"]'
      variants: '["default"]'

  NVIDIA:
    uses: ./.github/workflows/run-compiler.yml
    with:
      compiler: "NVIDIA"
      cpu_target: "px"
      test_modes: '["opt"]'
      variants: '["default"]'
