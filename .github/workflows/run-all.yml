name: run-all

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review

#
# a new push to a branch cancels the run of its previous commit (never on main)
#
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  GNU:
    uses: ./.github/workflows/run-compiler.yml
    with:
      compiler: "GNU"
      cpu_target: "x86-64"
      variants: '["default", "unbalanced", "hypre"]'
      tests_default: '["lid_driven_cavity", "differentially_heated_cavity", "deforming_circle", "rising_bubble", "start_stop", "restart_two_fluid", "implicit_diffusion", "poisson", "taylor_green_vortex_2d", "navier_slip", "deforming_circle-thinc", "rising_bubble-thinc", "restart_two_fluid-thinc", "implicit_diffusion-thinc", "plic_unit", "plic_advection", "plic_momentum", "viscosity_limiter", "contact_angle", "rising_bubble-plic", "restart_two_fluid-plic", "rising_bubble-thincsplit", "restart_two_fluid-thincsplit", "zero_net_acceleration", "implicit_diffusion-plic", "implicit_diffusion-thincsplit"]'

  INTEL:
    uses: ./.github/workflows/run-compiler.yml
    with:
      compiler: "INTEL"
      test_modes: '["dbg"]'
      variants: '["default"]'

  NVIDIA:
    uses: ./.github/workflows/run-compiler.yml
    with:
      compiler: "NVIDIA"
      cpu_target: "px"
      test_modes: '["opt"]'
      variants: '["default"]'
