name: "Test"
description: "Runs a CaNS test case and uploads its logs"
inputs:
  name:
    description: "Name used for the log artifact"
    required: true
  compiler:
    description: "Compiler environment used by the CaNS executable"
    required: true
  mode:
    description: "Build mode of the executable (opt, dbg, opt-omp)"
    required: false
    default: "opt"
  test_name:
    description: "Test case name; a suffix selects the interface method: -thinc, -plic, or -thincsplit (THINC in the split advection)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Get Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13

    - name: Get Python packages for testing
      if: ${{ inputs.test_name != 'poisson' }}
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest scipy matplotlib

    - name: Run test
      shell: bash
      run: |
        source ".github/actions/build/scripts/setenv-${{ inputs.compiler }}.sh"
        chmod +x ./run/cans
        #
        # short versions of the long cases (see their `testit.sh`) where the run is slow and only meant to catch
        # run-time errors: debug builds, and the CPU builds of the NVIDIA compiler
        #
        if [ "${{ inputs.mode }}" = "dbg" ] || [ "${{ inputs.compiler }}" = "NVIDIA" ]; then export TEST_SHORT=1; fi
        test_name="${{ inputs.test_name }}"
        case "$test_name" in
          *-thincsplit) export TEST_TWO_FLUID_INPUT="ifc_reconstruction = 'thinc', ifc_advection = 'split'";;
          *-*)          export TEST_TWO_FLUID_INPUT="ifc_reconstruction = '${test_name#*-}'";;
        esac
        test_name="${test_name%%-*}"
        cd "tests/$test_name" || exit 1
        bash ./testit.sh

    - name: Upload log files
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ inputs.name }}
        path: run/*.log

    - name: Print log files
      if: ${{ always() }}
      shell: bash
      run: |
        for log_file in run/*.log
        do
          [ -e "$log_file" ] || continue
          echo "Printing log file $log_file"
          cat "$log_file"
        done
