name: "Build"
description: "Compiles dependencies and CaNS for multiple compilers and build profiles"
inputs:
  name:
    description: "Name of the build"
    required: true
  compiler:
    description: "The compiler to use (e.g., GNU, NVIDIA, INTEL)"
    required: true
  compiler_flags:
    description: "Additional flags for compilation"
    default: ""
  no-rebuild:
    description: "Do not rebuild CaNS and dependencies"
    default: false
  get-dependencies:
    description: "With no-rebuild, also get the compiled dependencies (only needed by a test that builds the code)"
    default: true

runs:
  using: "composite"
  steps:
    - name: Set up Intel oneAPI
      if: ${{ inputs.compiler == 'INTEL' }}
      uses: rscohn2/setup-oneapi@e45e38db502de365efd15f94e8faa4e5542a1c6f # v0
      with:
        components: |
          ifx
          impi

    - name: Install compiler
      shell: bash
      run: |
        echo "INFO: Installing compiling environment: ${{ inputs.compiler }}"
        chmod a+x ./.github/actions/build/scripts/install-${{ inputs.compiler }}.sh
        source ./.github/actions/build/scripts/install-${{ inputs.compiler }}.sh

    - name: Get dependencies
      id: get-dependencies
      if: ${{ inputs.no-rebuild == 'true' && inputs.get-dependencies == 'true' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: compiled-libs-${{ inputs.name }}
        path: dependencies/
    - name: Get dependencies (second attempt)
      if: ${{ steps.get-dependencies.outcome == 'failure' }}
      uses: actions/download-artifact@v8
      with:
        name: compiled-libs-${{ inputs.name }}
        path: dependencies/
    - name: Build dependencies
      if: ${{ inputs.no-rebuild != 'true' }}
      shell: bash
      run: |
        source .github/actions/build/scripts/setenv-${{ inputs.compiler }}.sh
        make libs FCOMP=${{ inputs.compiler }}
    - name: Put dependencies
      if: ${{ inputs.no-rebuild != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: compiled-libs-${{ inputs.name }}
        path: dependencies/
        retention-days: 1

    - name: Get CaNS build
      id: get-build
      if: ${{ inputs.no-rebuild == 'true' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: cans-${{ inputs.name }}
        path: run/
    - name: Get CaNS build (second attempt)
      if: ${{ steps.get-build.outcome == 'failure' }}
      uses: actions/download-artifact@v8
      with:
        name: cans-${{ inputs.name }}
        path: run/
    - name: Build CaNS
      if: ${{ inputs.no-rebuild != 'true' }}
      shell: bash
      run: |
        source .github/actions/build/scripts/setenv-${{ inputs.compiler }}.sh
        make FCOMP=${{ inputs.compiler }} ${{ inputs.compiler_flags }}
    - name: Put CaNS build
      if: ${{ inputs.no-rebuild != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: cans-${{ inputs.name }}
        path: run/cans
        retention-days: 7
